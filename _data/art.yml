# Artwork shown on /art/ (and on the home page when `featured: true`).
#
# To add a piece, the easy way:   scripts/add-art.sh ~/Desktop/my-painting.jpg "Title" painting
# By hand: put the image in assets/art/ (and an ~800px copy in assets/art/thumbs/),
# then add an entry below. Pieces appear in the order listed, within each category.
#
#   title:        shown under the image and in the lightbox
#   image:        filename inside assets/art/
#   category:     one of the keys in _data/art_categories.yml
#   description:  optional, shown in the lightbox
#   year:         optional
#   width/height: thumbnail size in pixels (prevents layout jumping while loading)
#   featured:     optional, true = one of the 4 pieces shown on the home page

