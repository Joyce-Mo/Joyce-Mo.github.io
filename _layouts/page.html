---
layout: default
---
<article class="page{% if page.wide %} page-wide{% endif %}">
  <header class="page-head reveal">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="reveal" style="--i:1">
    {{ content }}
  </div>
</article>
