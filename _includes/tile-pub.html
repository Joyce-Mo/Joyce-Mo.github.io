{%- assign p = include.item -%}
{%- if p -%}
<a class="tile tile-text {{ include.size | default: 't-sq' }} reveal" style="--i:{{ include.i | default: 0 }}" href="{{ p.url | default: '/research/' }}"{% if p.url %} target="_blank" rel="noopener"{% endif %}>
  <div class="tile-head">
    <span>Research · {{ p.type }}</span>
    <span class="tile-btn">{% include arrow.html %}</span>
  </div>
  <div class="tile-body">
    <h3 class="tile-title">{{ p.title }}</h3>
    <p class="tile-sub">{{ p.venue }} · {{ p.year }}</p>
  </div>
</a>
{%- endif -%}
