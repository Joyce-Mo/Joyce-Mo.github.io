{%- assign p = include.item -%}
{%- if p -%}
<a class="tile tile-text {{ include.size | default: 't-sq' }} reveal" style="--i:{{ include.i | default: 0 }}" href="{{ p.url | relative_url }}">
  <div class="tile-head">
    <span>Writing · {{ p.date | date: "%b %Y" }}</span>
    <span class="tile-btn">{% include arrow.html %}</span>
  </div>
  <div class="tile-body">
    <h3 class="tile-title">{{ p.title }}</h3>
    <p class="tile-sub clamp">{{ p.description | default: p.excerpt | strip_html | strip_newlines | truncatewords: 26 }}</p>
  </div>
</a>
{%- endif -%}
